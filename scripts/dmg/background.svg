<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- The disk image window's background, in Dialog's design language: the #F7F7F7 ground, the
       brand's lilac → rose → peach halo at the top, ink #0A0A0A. Finder draws the two icons on it
       at the spots scripts/dmg/settings.py gives them: Chauffeur at (170, 200), Applications at
       (490, 200), the arrow between them.
       To change it: edit this file, then run scripts/dmg/render-background.sh, which renders
       background.png (1x) and background@2x.png (Retina) beside it. -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6D7FC"/>
      <stop offset="0.5" stop-color="#F5BBBD"/>
      <stop offset="1" stop-color="#F3B37D"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="#F7F7F7"/>
  <ellipse cx="330" cy="-20" rx="400" ry="150" fill="url(#wash)" filter="url(#soft)" opacity="0.7"/>
  <text x="330" y="86" text-anchor="middle" fill="#0A0A0A"
        font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif"
        font-size="19" font-weight="600" letter-spacing="-0.2">Drag Chauffeur to Applications</text>
  <g fill="none" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 200 H392"/>
    <path d="M384 193 L392 200 L384 207"/>
  </g>
</svg>
