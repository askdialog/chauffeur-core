[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.37.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
chauffeurd = { path = "crates/chauffeurd" }
shlex = "2"
semver = "1"
chauffeur-protocol = { path = "crates/chauffeur-protocol" }
chauffeur-design = { path = "crates/chauffeur-design" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.30"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "backup"] }
sqlite-vec = "0.1.6"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
rand = "0.10"
regex = "1"
percent-encoding = "2"
globset = "0.4"
walkdir = "2"
tempfile = "3"
reqwest = { version = "0.13", features = ["json"] }
portable-pty = "0.9"
base64 = "0.23"
url = "2"
sha2 = "0.11"
hex = "0.4"
tar = "0.4"
flate2 = "1"
zstd = "0.14"
zeroize = "1"
ed25519-dalek = "3.0"
bs58 = "0.5"
feed-rs = "3"
sentry-types = "0.49"

[profile.dev.package."*"]
opt-level = 1

# Shipped binaries: smaller and faster for a longer build, which only packaging pays.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
