name: Linux desktop
# Packaging changes are checked immediately; the nightly build covers ordinary source changes.
# The private distribution also verifies packages before publishing a release.
on:
  push:
    branches: [main]
    paths: &packaging-paths
      - .github/workflows/linux-desktop.yml
      - scripts/package-linux*.sh
      - scripts/smoke-linux-desktop.sh
      - app/src-tauri/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - '**/package.json'
      - '**/bun.lock'
      - sidecar/scripts/**
  pull_request:
    paths: *packaging-paths
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-desktop-${{ github.ref }}
  # A run on `main` is left to finish: cancelled, it would save no cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: linux-desktop
          # As Core CI: only `main` saves, and pull requests restore its cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore Bun's package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-
      # Installed by apt each run: cache-apt-pkgs-action's restore left GTK and WebKit's libraries
      # unfindable by the linker.
      - name: Install desktop build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Build the installable desktop
        env:
          # dpkg-deb's default compression took 2 min 45 s of this step for a package that is
          # only this run's artifact; zstd's level 3 packs the same files.
          DPKG_DEB_COMPRESSOR_TYPE: zstd
          DPKG_DEB_COMPRESSOR_LEVEL: '3'
        run: scripts/package-linux-desktop.sh
      - name: Install the package in a clean Ubuntu 24.04 and start its daemon
        run: scripts/smoke-linux-desktop.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chauffeur-ubuntu-desktop
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
